[package]
name = "three-d-raytrace"
version = "0.1.0"
edition = "2021"
description = "Path tracing for three-d scenes: a CPU reference tracer and a compute shader tracer on the wgpu backend"
license = "MIT"
publish = false

[features]
default = ["export"]
# Writing the image as PNG (tone mapped) or OpenEXR (linear HDR)
export = ["dep:image"]
# Showing the render image with three-d: as a texture with any backend
three-d = ["dep:three-d", "dep:web-time"]
# The wgpu backend of three-d: device access and what the GPU tracers need
wgpu = ["three-d", "three-d/wgsl", "dep:wgpu", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]

[dependencies]
three-d-asset = "0.10"
three-d = { path = "..", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "exr"], optional = true }
# Only to let wgpu read the WGSL of the compute tracer, the same wgpu as three-d's
wgpu = { version = "29", default-features = false, features = ["wgsl"], optional = true }

# A clock for the time budget of the preview in browsers
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = { version = "1", optional = true }
# To compile the compute tracer in the background with WebGPU's createComputePipelineAsync
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# To trace and compile the shaders of the preview at a low priority beside the application
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
naga = { version = "29", features = ["wgsl-in"] }

# The preview tests also run on an OpenGL context without a window
[target.'cfg(target_os = "linux")'.dev-dependencies]
three-d = { path = "..", default-features = false, features = ["headless-gl"] }

[[example]]
name = "garden_gpu"
required-features = ["wgpu"]

[[example]]
name = "print"
required-features = ["wgpu"]
