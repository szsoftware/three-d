name: build

on:
  push:
    branches:
      - master
      - 0.*
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-Dwarnings"

jobs:
  desktop:
    name: Check Desktop
    runs-on: ${{ matrix.os }}
    strategy:
      # Each system tests another graphics API, so one failing must not hide the result of the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          override: true

      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Check
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --examples --all-features

      - name: Formatting
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy

      # The ray tracing crate of the fork (raytrace/), its tests run on the CPU and need no graphics driver
      - name: Clippy ray tracing
        run: cargo clippy -p three-d-raytrace --all-targets

      - name: Test ray tracing
        run: cargo test -p three-d-raytrace

      # Software drivers for Vulkan and OpenGL (through EGL), so that the tests of the wgpu backend run without a GPU and compare it with the OpenGL backend
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get install -y mesa-vulkan-drivers libegl1 libegl-mesa0 libgl1-mesa-dri && echo "THREE_D_EXPECT_BACKEND=vulkan" >> $GITHUB_ENV

      # macOS tests the wgpu backend on Metal and Windows on DirectX 12 (software adapter), both against what OpenGL returned on Linux
      - if: startsWith(matrix.os, 'macos')
        run: echo "THREE_D_EXPECT_BACKEND=metal" >> $GITHUB_ENV
      - if: startsWith(matrix.os, 'windows')
        shell: bash
        run: echo "THREE_D_EXPECT_BACKEND=dx12" >> $GITHUB_ENV

      # The shader compiler Windows comes with (FXC) fails on shaders that sample a texture in a loop, so the tests use the new one (DXC) of the Windows SDK, which wgpu finds on the PATH
      - if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          dxc=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/dxcompiler.dll | sort -V | tail -1)
          echo "Using $dxc"
          cygpath -w "$(dirname "$dxc")" >> $GITHUB_PATH

      - name: Graphics adapter of the tests
        shell: bash
        run: echo "THREE_D_REQUIRE_WGPU=1" >> $GITHUB_ENV && THREE_D_REQUIRE_WGPU=1 cargo test --all-features --lib adapter_is_the_expected_one -- --nocapture

      - name: Test
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all-features --lib

      # The same tests with wgpu on top of OpenGL (feature wgpu-gl), again on the software driver
      - name: Test wgpu on OpenGL
        if: startsWith(matrix.os, 'ubuntu')
        run: WGPU_BACKEND=gl THREE_D_EXPECT_BACKEND=gl cargo test --all-features --lib

  semver:
    name: Check API compatibility with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      # The public API must stay compatible with upstream, new backends may only add to it
      - name: Compare with upstream master
        run: |
          git remote add upstream https://github.com/asny/three-d.git
          git fetch upstream master
          cargo semver-checks --baseline-rev upstream/master

  web:
    name: Check Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Check ray tracing for the web
        run: rustup target add wasm32-unknown-unknown && cargo check -p three-d-raytrace --target wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build examples
        run: |
          for example in `find examples -maxdepth 1 -mindepth 1 -type d -printf "%f\n"` ; do
            if [ -f "examples/$example/Cargo.toml" ]; then
              echo "::group::Build $example example"
              pushd examples/$example
              CARGO_TARGET_DIR=../../target wasm-pack build --target web --out-name web --dev
              popd
              echo "::endgroup::"
            fi
          done
