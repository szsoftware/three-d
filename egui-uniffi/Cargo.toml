[package]
name = "three-d-egui-uniffi"
version = "0.1.0"
edition = "2021"
description = "Panels, switches and options of egui described from Kotlin (or any uniffi language) as a tree of nodes, drawn by three-d into the same picture as the 3D view, with the clicks and changed values handed back"
license = "MIT"
publish = false

[lib]
# lib: linked into the cdylib of an application crate (the KMP library), which then has these types in its bindings;
# cdylib: bindings and tests of this crate on its own
crate-type = ["lib", "cdylib"]

[features]
default = ["wgpu", "images"]
# Draws on contexts of three-d's wgpu backend too (with three-d's core painter); OpenGL/WebGL always works
wgpu = ["three-d/wgpu"]
# Colors code of every language syntect knows in Widget::TextField (C#, Java, JavaScript, SQL, …); without it egui_extras
# colors Rust, TOML, Python, C and C++. It makes the library about 1 MB larger.
syntect = ["egui_extras/syntect"]
# Widget::Image and the other images from the bytes of PNG, JPEG, GIF and WebP files (moving ones too) and SVG (sharp
# at any size), decoded by egui_extras' loaders; without it only images from pixels (set_image_rgba)
images = ["egui_extras/image", "egui_extras/gif", "egui_extras/webp", "egui_extras/svg", "dep:image"]

[dependencies]
uniffi = "0.32"
# ThreadBound of the cargo-uniffi Gradle plugin; the same tag as three-d-raytrace-uniffi, so that both share one copy in an application
cargo-uniffi-support = { git = "https://github.com/szsoftware/cargo-uniffi-gradle-plugin", tag = "support-v0.4.0-alpha.19", default-features = false, features = ["thread-bound"] }
three-d = { path = "..", default-features = false, features = ["egui-gui"] }
web-time = "1"
# Diagrams (Widget::Plot): lines, points, bars and box plots; 0.35 is the one for egui 0.34 of three-d
egui_plot = { version = "0.35", default-features = false }
# The calendar of Widget::DatePicker and the colors of code in Widget::TextField; 0.34 as egui
egui_extras = { version = "0.34", default-features = false, features = ["datepicker"] }
# PNG and JPEG for egui_extras' image loader (which takes the image crate without formats)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
# The days of Widget::DatePicker, as egui_extras has them
jiff = { version = "0.2.23", default-features = false, features = ["std"] }

# OpenGL through EGL without a window for the tests
[target.'cfg(target_os = "linux")'.dev-dependencies]
three-d = { path = "..", default-features = false, features = ["egui-gui", "headless-gl"] }
