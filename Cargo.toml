# Fork addition: further crates of the fork live next to three-d, the examples stay separate crates
[workspace]
members = ["raytrace"]
exclude = ["examples", "vendor"]

# Fork addition: wgpu-hal with a patch, so that wgpu notices a reset of the graphics card on OpenGL and reports a lost device,
# as on Vulkan, Metal and DirectX 12 (see "Lost devices" in docs/wgpu-backend.md). Applications that use three-d need the same entry.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
