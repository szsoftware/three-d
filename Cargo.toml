[package]
name = "three-d"
version = "0.20.0" # Remember to update example links
authors = ["Asger Nyman Christiansen <asgernyman@gmail.com>"]
edition = "2021"
description = "2D/3D renderer - makes it simple to draw stuff across platforms (including web)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/asny/three-d"
categories = ["graphics", "rendering", "visualization", "wasm", "web-programming"]
keywords = ["3d", "gamedev", "webassembly", "opengl", "webgl"]
exclude = ["/examples", ".gitignore", "/web", "/raytrace", "/vendor"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown"]

[features]
default = ["window"]
window = ["glutin", "winit", "raw-window-handle", "wasm-bindgen", "serde", "serde-wasm-bindgen", "web-sys"] # Window module
egui-gui = ["egui_glow", "egui"] # Additional GUI features 
text = ["swash", "lyon"] # Text mesh generation features
wgpu = ["dep:wgpu", "dep:naga", "dep:pollster"] # Additional wgpu backend (see docs/wgpu-backend.md), OpenGL/WebGL stays the default
wgsl = ["wgpu", "naga?/wgsl-in"] # Shader programs written in WGSL for the wgpu backend, see Program::from_wgsl_source
headless-gl = ["glutin"] # An OpenGL context without a window, with a screen that is not shown (Linux, through EGL), see Context::new_headless_gl_with_screen
wgpu-gl = ["wgpu", "wgpu?/gles"] # Lets the wgpu backend run on top of OpenGL (ES) on native targets, for graphics cards without a usable Vulkan driver

[dependencies]
glow = "0.17"
cgmath = "0.18"
three-d-asset = { version = "0.10" }
thiserror = "2"
open-enum = "0.5"
winit = {version = "0.30", optional = true}
egui = { version = "0.34", optional = true }
egui_glow = { version = "0.34", optional = true }
swash = { version = "0.2", optional = true }
lyon = { version = "1", optional = true }
wgpu = { version = "29", optional = true, default-features = false, features = ["std", "naga-ir", "vulkan", "metal", "dx12", "webgpu"] }
naga = { version = "29", optional = true, features = ["glsl-in"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
glutin = { version = "0.32", optional = true }
raw-window-handle = { version = "0.6", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
pollster = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = {version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
web-sys = { version = "0.3", features = ['Document', 'HtmlCollection', 'HtmlCanvasElement', 'Window'], optional = true }
web-time = "1.1"
# WebGPU checks more than wgpu does natively, the shaders are handed over as WGSL text with that check turned off (see the wgpu backend)
wgpu = { version = "29", optional = true, default-features = false, features = ["wgsl"] }
naga = { version = "29", optional = true, features = ["wgsl-out"] }

[dev-dependencies]
rand = "0.7"
three-d-asset = { version = "0.10", features = ["hdr", "gltf", "obj", "vol", "pcd", "png", "jpeg", "http", "data-url"] }
noise = {version = "0.6", default-features = false}
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# All shader languages wgpu translates to, used to test the shaders for every platform on any platform (only with the wgpu feature)
naga = { version = "29", features = ["glsl-in", "wgsl-out", "spv-out", "msl-out", "hlsl-out"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# OpenGL without a window, used to compare the wgpu backend with the OpenGL backend (only with the wgpu feature)
glutin = { version = "0.32", default-features = false, features = ["egl"] }

